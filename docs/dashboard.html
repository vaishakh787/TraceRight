<!DOCTYPE html>
<html>
<head>
  <title>Scan Intelligence Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #333; color: white; }
    .LOW { color: green; }
    .MEDIUM { color: orange; }
    .HIGH { color: red; font-weight: bold; }
    .CRITICAL { color: darkred; font-weight: bold; background: #ffe0e0; }
  </style>
</head>
<body>
  <h1>Recent Risk Assessments</h1>
  <table id="resultsTable">
    <thead>
      <tr><th>QR Code</th><th>Risk Score</th><th>Risk Level</th><th>Assessed At</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    fetch('http://localhost:3000/v1/dashboard/recent', {
  headers: {
    'X-API-Key': 'dev-key-12345'
  }
})
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('tbody');
        data.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row.qr_code}</td>
            <td>${row.risk_score}</td>
            <td class="${row.risk_level}">${row.risk_level}</td>
            <td>${new Date(row.assessed_at).toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        });
      });
  </script>
</body>
</html>
